name: Tests de Appium

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias de Python
        run: pip install -r requirements.txt

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar Appium
        run: |
          npm install -g appium@3.6.0
          appium driver install uiautomator2

      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Levantar Appium en segundo plano
        run: appium &

      - name: Esperar que Appium esté listo
        run: |
          echo "Esperando Appium..."
          for i in $(seq 1 30); do
            curl -s http://localhost:4723/status && echo "Appium listo!" && break
            sleep 2
          done

      - name: Correr tests sobre emulador Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: |
            adb wait-for-device
            sleep 15
            pytest tests/step_defs/ -v

      - name: Subir capturas de pantalla
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: tests/screenshots/
          if-no-files-found: ignore